name: Compose Compiler Reports

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reports:
    name: Compose compiler reports
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_KEY }}
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Flutter AAR (arm64-v8a, armeabi-v7a)
        working-directory: flutter/wavlin_visuals
        run: |
          flutter pub get
          flutter build aar --no-debug --no-profile --target-platform android-arm,android-arm64

      - name: Compile Kotlin with Compose compiler reports
        run: ./gradlew --console=plain :app:compileFossReleaseKotlin -PenableComposeCompilerReports=true --warning-mode summary
        env:
          WAVLIN_REQUIRE_FLUTTER: "true"
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Upload Compose reports
        uses: actions/upload-artifact@v6
        with:
          name: compose-compiler-reports
          path: app/build/compose_metrics/*
          if-no-files-found: error
