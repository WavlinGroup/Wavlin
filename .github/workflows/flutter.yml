name: Flutter visuals

on:
  push:
    paths:
      - "flutter/**"
      - ".github/workflows/flutter.yml"
  pull_request:
    paths:
      - "flutter/**"
      - ".github/workflows/flutter.yml"
  workflow_dispatch:

jobs:
  check:
    name: Analyze and test wavlin_visuals
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter/wavlin_visuals
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
